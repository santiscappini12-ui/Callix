<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Callix</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <h1>📹 Callix</h1>
  <div id="user-badge"></div>
</header>

<!-- Pantalla de login / registro -->
<section id="auth-screen" class="screen active">
  <div class="auth-card">
    <h2 id="auth-title">Iniciar sesión</h2>
    <input id="auth-username" type="text" placeholder="Usuario" autocomplete="username" />
    <input id="auth-password" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <div class="auth-error" id="auth-error"></div>
    <button id="auth-submit">Entrar</button>
    <div class="auth-switch">
      <span id="auth-switch-text">¿No tenés cuenta? <a>Registrate</a></span>
    </div>
  </div>
</section>

<!-- Pantalla de inicio: crear o unirse a una sala -->
<section id="home-screen" class="screen">
  <div class="home-card">
    <h2>Crear una nueva sala</h2>
    <button id="create-room-btn">Crear sala</button>
    <div id="invite-box">
      <input id="invite-link" type="text" readonly />
      <button id="copy-invite-btn" class="secondary">Copiar</button>
    </div>
    <div class="divider">o</div>
    <h2>Unirse con un código</h2>
    <input id="join-room-input" type="text" placeholder="Código de sala" />
    <button id="join-room-btn" class="secondary">Entrar a la sala</button>
  </div>
</section>

<!-- Pantalla de la llamada -->
<section id="call-screen" class="screen">
  <div id="call-body">
    <div id="videos"></div>

    <div id="side-panel">
      <div class="side-tabs">
        <button class="side-tab active" data-tab="chat">💬 Chat</button>
        <button class="side-tab" data-tab="whiteboard">🖊️ Pizarra</button>
      </div>

      <div class="side-view active" id="tab-chat">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input id="chat-input" type="text" placeholder="Escribí un mensaje..." />
          <button id="chat-send-btn">Enviar</button>
        </div>
      </div>

      <div class="side-view" id="tab-whiteboard">
        <div id="whiteboard-toolbar">
          <button id="wb-clear-btn" class="secondary">Borrar todo</button>
          <input type="color" id="wb-color" value="#1a1a1a" title="Color" />
          <input type="range" id="wb-size" min="1" max="20" value="3" title="Grosor" />
        </div>
        <div id="whiteboard-canvas-wrap">
          <canvas id="whiteboard-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div id="controls">
    <span id="room-badge"></span>
    <button id="mic-btn" class="secondary">🎤 Silenciar</button>
    <button id="cam-btn" class="secondary">📷 Apagar cámara</button>
    <button id="screen-btn" class="secondary">🖥️ Compartir pantalla</button>
    <button id="chat-toggle-btn" class="secondary">💬 Chat</button>
    <button id="wb-toggle-btn" class="secondary">🖊️ Pizarra</button>
    <button id="leave-btn" class="danger">📞 Salir</button>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
